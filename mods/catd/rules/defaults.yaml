^ProducesInfantry:
	Inherits@QUEUEUPDATER: ^QueueUpdater
	Inherits@PRIMARY: ^PrimaryBuilding
	ProductionQueue@MQINF:
		Type: InfantryMQ
		DisplayOrder: 3
		Group: Infantry
		LowPowerModifier: 250
		ReadyAudio: UnitReady
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	Production@SQINF:
		Produces: InfantrySQ, Soldier
		PauseOnCondition: build-incomplete || sabotage
		RequiresCondition: !global-multiqueue
	Production@MQINF:
		Produces: InfantryMQ, Soldier
		PauseOnCondition: build-incomplete || sabotage
		RequiresCondition: global-multiqueue
	ProductionBar@SQINF:
		ProductionType: InfantrySQ
		RequiresCondition: !global-multiqueue
	ProductionBar@MQINF:
		ProductionType: InfantryMQ
		RequiresCondition: global-multiqueue
	GrantExternalConditionToProduced:
		Condition: produced
	InfiltrateForTimedCondition@Sabotage:
		Condition: sabotage
		Duration: 1125
		Types: Infiltrate
		InfiltrationNotification: BuildingInfiltrated
		InfiltratedNotification: OnHold
		ShowSelectionBar: true
	Targetable:
		TargetTypes: GroundActor, Structure, Infiltrate, DetonateAttack

