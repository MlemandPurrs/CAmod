^ProducesUpgrades:
	Inherits@QUEUEUPDATER: ^QueueUpdater
	Production@UPG:
		Produces: Upgrade
		PauseOnCondition: build-incomplete
	ProductionBar@UPG:
		ProductionType: Upgrade
	Exit@UPG:
		ProductionTypes: Upgrade
	ProvidesPrerequisite@UpgradesProducer:
		Prerequisite: upgrades.producer
		RequiresCondition: !build-incomplete
	-GrantConditionOnPrerequisite@MQ:

^ProductionCostInfantryGDI:
	ProductionCostMultiplier@GDIA:
		Multiplier: 110
		Prerequisites: gdia.doctrine
	ProductionCostMultiplier@GDIB:
		Multiplier: 110
		Prerequisites: gdib.doctrine
	ProductionCostMultiplier@GDIC:
		Multiplier: 90
		Prerequisites: gdic.doctrine

^ProductionCostVehicleGDI:
	ProductionCostMultiplier@GDIA:
		Multiplier: 90
		Prerequisites: gdia.doctrine
	ProductionCostMultiplier@GDIB:
		Multiplier: 110
		Prerequisites: gdib.doctrine
	ProductionCostMultiplier@GDIC:
