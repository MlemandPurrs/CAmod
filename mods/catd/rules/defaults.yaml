^UpgradeOverlay:
	WithDecoration@UpgradeOverlay:
		Image: upgrade
		Palette: chrome
		Sequence: upgrade
		Position: Center
		RequiresCondition: upgrading
		BlinkInterval: 5
		BlinkPattern: on
		ValidRelationships: Ally, Neutral

^AffectedbyCompositeArmor:
	DamageMultiplier@Upgrade:
		RequiresCondition: armorup.on
		Modifier: 90
	GrantConditionOnPrerequisite@Upgrade:
		Condition: armorup.on
		Prerequisites: armorup.upgrade

^Rock:
	Inherits@1: ^SpriteActor
	Interactable:
	Tooltip:
		Name: Rock
		ShowOwnerRow: false
	RenderSprites:
		Palette: terrain
	WithSpriteBody:
	Building:
		Footprint: x
		Dimensions: 1,1
	AppearsOnRadar:
	RadarColorFromTerrain:
		Terrain: Tree
	AppearsOnMapPreview:
		Terrain: Tree
	HiddenUnderShroud:
	MapEditorData:
		Categories: Decoration
	RequiresSpecificOwners:
		ValidOwnerNames: Neutral

^ChemApplicable:
	WithColoredOverlay@Corrosion:
		RequiresCondition: chem-condition
        Color: 0054B024
	TimedConditionBar@Corrosion:
		Condition: chem-condition
		Color: 987C08
	ExternalCondition@Corrosion:
		Condition: chem-condition
    Targetable@Corrosion:
        TargetTypes: ChemApplicable
        RequiresCondition: !chem-condition
    SpeedMultiplier@Corrosion:
        Modifier: 70
        RequiresCondition: chem-condition

^Hackable:
	MindControllable:
		ControlledConditions:
			hack: hacked
		RevokingConditions:
			hack: restoring
	Targetable@HACKABLE:
		TargetTypes: Hackable
		RequiresCondition: !hacked
	MindControllableProgressBar@HACKABLE:
		ControlTypes: Hack
		Color: 1ce312
		RequiresCondition: !hacked
	WithDecoration@HACKED:
		Image: hacked
		Sequence: hacked
		RequiresCondition: hacked && !restoring
		Position: Center
		Palette: effect
		ValidRelationships: Ally, Neutral, Enemy
	WithDecoration@RESTORING:
		Image: hacked
		Sequence: restoring
		RequiresCondition: restoring
		Position: Center
		Palette: effect
		ValidRelationships: Ally, Neutral, Enemy
	ExternalCondition@GHIGH:
		Condition: greenhighlight
	WithColoredOverlay@GHIGH:
		Color: 80ff8080
		RequiresCondition: greenhighlight

^HackableOverloadable:
	Inherits: ^Hackable
	WithDecoration@HACKED:
		Sequence: overloading
	ChangesHealth@HACKED:
		Step: -2000
		StartIfBelow: 101
		Delay: 20
		RequiresCondition: hacked && !restoring

^AffectedByDriverKill:
	GrantConditionIfOwnerIsNeutral:
		Condition: driver-dead
	Capturable@DRIVER_DEAD:
		Types: driverless_vehicle
		RequiresCondition: driver-dead
		ValidRelationships: Neutral
		CancelActivity: true
	ChangesHealth@DRIVER_DEAD:
		PercentageStep: -1
		Delay: 50
		StartIfBelow: 101
		DamageCooldown: 0
		RequiresCondition: driver-dead
	Targetable@DRIVERKILL:
		TargetTypes: DriverKill
		RequiresCondition: !driver-dead && hp-below-25-perc
	GrantConditionOnDamageState@DriverKillLessThan25:
		Condition: hp-below-25-perc
		ValidDamageStates: Critical
	Targetable@AICAPTURE:
		TargetTypes: NoCrew
		RequiresCondition: driver-dead
	TooltipDescription@DRIVER_DEAD:
		Description: Crewless. Capturable by any infantry.
		RequiresCondition: driver-dead
	ExternalCondition@HIGH:
		Condition: highlight
	WithColoredOverlay@HIGH:
		Color: ffffff80
		RequiresCondition: highlight

^CanCaptureDriverlessVehicles:
	Captures@DRIVER_KILL:
		CaptureTypes: driverless_vehicle
	CaptureManager:

#Hacky but helps Bots deal with abandoned vehicles due to snipers
^BotCaptureHelper:
	Armament@AIHELPER:
		Weapon: commandeer
		Name: commandeer
		TargetRelationships: Neutral
		RequiresCondition: botowner
	GrantConditionOnBotOwner@AIHELPER:
		Condition: botowner
		Bots: ai
	GrantConditionOnAttack@AIHELPER:
		Condition: removeunit
		ArmamentNames: commandeer
		RequiresCondition: botowner
	KillsSelf@AIHELPER:
		RemoveInstead: true
		RequiresCondition: removeunit
	AutoTargetPriority@AIHELPER:
		ValidTargets: NoCrew
		RequiresCondition: botowner
		Priority: 1
	WithInfantryBody:
		AttackSequences:
			primary: shoot
            secondary: shoot
			commandeer: stand

^AffectedByFieldRepair:
	ChangesHealth@FieldRepair:
		Step: 0
		PercentageStep: 2
		Delay: 25
		StartIfBelow: 101
		DamageCooldown: 0
		RequiresCondition: fieldrepair && !emp-condition
	WithDecoration@FieldRepair:
		RequiresSelection: false
		Image: repair
		Sequence: repair-small
		Palette: player
		IsPlayerPalette: true
		Position: Center
		Margin: 0,0
		ValidRelationships: Ally, Neutral, Enemy
		RequiresCondition: fieldrepair && damaged && !emp-condition
		BlinkInterval: 25
		BlinkPattern: Off, On
	ExternalCondition@FieldRepair:
		Condition: fieldrepair
