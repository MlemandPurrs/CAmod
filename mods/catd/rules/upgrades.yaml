^Upgrade:
	AlwaysVisible:
	Interactable:
	ScriptTriggers:
	Buildable:
		Queue: Upgrade
		BuildLimit: 1
		BuildDurationModifier: 100
	ProvidesPrerequisite@upgradename:
	ProvidesUpgrade@upgradename:

ANYDOCTRINE:
	AlwaysVisible:
	Interactable:
	Tooltip:
		Name: Active Doctrine
	Buildable:
		Description: Active Doctrine
	ProvidesPrerequisite:

apb.upgrade:
	Inherits: ^Upgrade
	Tooltip:
		Name: Upgrade: AP Bullets
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: dept, ~techlevel.medium
		Description: Upgrades: Smallcalibre damage
        Icon: apb
	TooltipExtras:
		Strengths: + 10% more damage dealt
        Attributes: Affects Rifle Soldier, GDI Jeep,\nNod Buggy and Guard Tower
	Valued:
		Cost: 1000
	RenderSprites:
		Image: upgicon

raufoss.upgrade:
