CRATE.DROP:
	Inherits: ^Crate
	Parachutable:
		FallRate: 26
		KilledOnImpassableTerrain: false
		ParachutingCondition: parachute
	Tooltip:
		Name: Money Crate
	RenderSprites:
		Image: wcrate
	CashTrickler@Normal:
		Interval: 13
		Amount: 2000
		RequiresCondition: !parachute && !zoneup.on
	CashTrickler@Upgraded:
		Interval: 13
		Amount: 3500
		RequiresCondition: !parachute && zoneup.on
	KillsSelf:
		Delay: 13
		RemoveInstead: true
		RequiresCondition: !parachute
	GrantConditionOnPrerequisite@supplylines:
		Condition: zoneup.on
		Prerequisites: supply.upgrade
	RenderSprites:
		Image: wcrate
    -MapEditorData:

spysatactivator:
	Interactable:
	EditorOnlyTooltip:
		Name: (Timed Spy Sattelite Activator)
	AlwaysVisible:
	Aircraft:
		Repulsable: False
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	RenderSpritesEditorOnly:
		Image: camera
	Health:
		HP: 1
	HitShape:
	ChangesHealth:
		Step: -1
		StartIfBelow: 101
		Delay: 1
	SpawnActorOnDeath:
		Actor: spysat
		SpawnAfterDefeat: False
        RequiresCondition: !ssat-enabled
	GrantConditionOnPrerequisite@enabling:
		Prerequisites: ssat
		Condition: ssat-enabled
	KillsSelf:
	Buildable:
		Queue: SupportPower
		Prerequisites: ~disabled
        Icon: 
	Tooltip:
		Name: "Dummy Actor to activate Timed Spy Sattelite"

spysat:
	Interactable:
	EditorOnlyTooltip:
		Name: (Timed Spy Sattelite)
	AlwaysVisible:
	Aircraft:
		Repulsable: False
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	RenderSpritesEditorOnly:
		Image: camera
	ProvidesPrerequisite:
		Prerequisite: ssat
	Health:
		HP: 1500
	HitShape:
	ChangesHealth:
		Step: -1
		StartIfBelow: 101
		Delay: 1
	ProduceActorPower@spysatactivesign:
        OrderName: SpySatteliteTimer
		Name: Spy Sattelite
		Description: Reveals the entire map,\nincluding shroud and fog.
		Icon: spysat
		Actors: e1
		Type: Infantry
		ChargeInterval: 1501
		SupportPowerPaletteOrder: 20
		DisplayTimerRelationships: Ally, Neutral, Enemy
		RequiresCondition: ssat-activated
	GrantConditionOnPrerequisite@spysatactivation:
		Prerequisites: ssat
		Condition: ssat-activated
	GrantConditionOnPrerequisite@satelliteexists:
		Prerequisites: uplink
		Condition: uplinkexists
	KillsSelf:
		RequiresCondition: !uplinkexists
	VoiceAnnouncement:
		RequiresCondition: uplinkexists
		Voice: Build
	DeathSounds:
		Voice: Die
	Voiced:
		VoiceSet: SatVoice
