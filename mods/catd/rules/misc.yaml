CAMERA:
	Interactable:
	AlwaysVisible:
	Immobile:
		OccupiesSpace: false
	BodyOrientation:
		QuantizedFacings: 1
	WithSpriteBody:
	RenderSpritesEditorOnly:
		Image: camera

CAMERA.small:
    Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (reveals small area to owner)
	RevealsShroud:
		Range: 5c512
		Type: CenterPosition
	MapEditorData:
		Categories: System

CAMERA.large:
    Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (reveals large area to owner)
	RevealsShroud:
		Range: 11c0
		Type: CenterPosition
	MapEditorData:
		Categories: System

CAMERA.scan:
    Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (radar scan reveal)
	RevealsShroud:
		Range: 5c512
		Type: CenterPosition
	DetectCloaked:
		Range: 5c512
	RenderDetectionCircle:
        TrailCount: 2
        Visible: Always
        UpdateLineTick: 6
        BorderWidth: 0

CAMERA.frep:
    Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (field repair proxy)
	ProximityExternalCondition@fieldrepair:
		Condition: fieldrepair
		ValidRelationships: Ally
		Range: 2c768
    WithRangeCircle@fieldrepair:
        Range: 2c768
        Visible: Always
        UsePlayerColor: false
        Color: FCFC54

CAMERA.spyplane:
    Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (spy plane reveal)
	RevealsShroud:
		Range: 10c0
		Type: CenterPosition
	DetectCloaked:
		Range: 10c0
    WithRangeCircle:
        Range: 10c0
        Visible: Always
        UsePlayerColor: true

CAMERA.hacker:
	Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (reveals the hacker)
	RevealsShroud:
		Range: 1c512
        Type: CenterPosition
	KillsSelf:
		RemoveInstead: true
		Delay: 50

CRATE:
	Inherits: ^Crate
	GiveCashCrateAction:
        SelectionShares: 33
		Amount: 2000
		UseCashTick: true
    HealActorsCrateAction:
        SelectionShares: 33
        #   TargetTypes: Heal, Repair
    LevelUpCrateAction:
        SelectionShares: 33
        Levels: 1
        Range: 2c0
        MaxExtraCollectors: 20
        ExcludedActorTypes: mcv, harv, tecn, tec2, scnt, engi, medi, mech, vice, jack, hack, mnly, mhq, mrj, disr, wtnk, xo, t55h, truk, ttrk, chin, ocar
	ExplodeCrateAction@nuke:
		Weapon: Atomic
		SelectionShares: 1
	GiveBaseBuilderCrateAction:
		SelectionShares: 0
		NoBaseSelectionShares: 100
		Units: mcv

MONEYCRATE:
	Inherits: ^Crate
	Tooltip:
		Name: Money Crate
	GiveCashCrateAction:
		Amount: 1000
		SelectionShares: 1
		UseCashTick: true
	RenderSprites:
		Image: wcrate

MINE:
	Inherits: ^SpriteActor
	Interactable:
		Bounds: 1024, 1024
    WithSpriteBody:
        Sequence: idle
	HiddenUnderFog:
	Mine:
		CrushClasses: crate
		DetonateClasses: mine
		AvoidFriendly: false
		BlockFriendly: false
	Health:
		HP: 5000
		NotifyAppliedDamage: false
	Armor:
		Type: Light
	Cloak:
		CloakSound:
		UncloakSound:
		Palette:
		DetectionTypes: Mine
		InitialDelay: 0
	Tooltip:
		Name: Mine
	Targetable:
		TargetTypes: GroundActor, Mine
	Immobile:
		OccupiesSpace: true
	HitShape:
	Explodes:
		Weapon: ATMine
    Explodes@EMP:
        Weapon: EMPMine
        RequiresCondition: emp.on
    GrantConditionOnPrerequisite@EMP:
		Condition: emp.on
		Prerequisites: emp.upgrade
	MapEditorData:
		Categories: System

FLARE:
	Immobile:
		OccupiesSpace: false
	RevealsShroud:
		Range: 3c0
		Type: CenterPosition
	RenderSprites:
		Image: flare
		Palette: terrain
	WithSpriteBody:
		StartSequence: open
	HiddenUnderFog:
		Type: CenterPosition
	Tooltip:
		Name: Flare
		ShowOwnerRow: false
	BodyOrientation:
		QuantizedFacings: 1
	MapEditorData:
		Categories: System
	Interactable:

