		Name: Construction Yard
    TooltipExtras:
        Strengths: Produces Buildings, Defenses, Upgrades
        Attributes: Can be undeployed above 50% health
        RequiresCondition: global-multiqueue
    TooltipExtras@SQ:
        Strengths: Produces Buildings, Defenses, Upgrades
        Attributes: Production speeds up with multiple\nCan be undeployed above 50% health
        RequiresCondition: !global-multiqueue
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 120000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 10c0
	GrantConditionOnDamageState@DAMAGED2:
		Condition: damaged2
		ValidDamageStates: Heavy, Critical
	Transforms:
        PauseOnCondition: being-demolished || build-incomplete || hacked || damaged2
		IntoActor: mcv
		Offset: 1,1
		Facing: 432
	BaseBuilding:
	BaseProvider:
		Range: 16c0
	WithBuildingBib:
	WithBuildingPlacedAnimation:
		RequiresCondition: !build-incomplete
	Power:
		Amount: 30
        RequiresCondition: !build-incomplete
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@gdi:
		Factions: gdi
		Prerequisite: structures.gdi
	ProvidesPrerequisite@nod:
		Factions: nod
		Prerequisite: structures.nod
	Buildable:
		Prerequisites: ~disabled
		Queue: BuildingSQ, BuildingMQ
		Description: Produces Structures and Defenses.\n\nAllows to research upgrades.
	ActorPreviewPlaceBuildingPreview:
		Animated: false
	RenderSprites:
		Image: cnst
		FactionImages:
            nod: ncst
	GrantConditionOnPlayerResources@botinsurance:
		Condition: noinsurance
		Threshold: 2500
	CashTrickler@botinsurance:
		Interval: 450
		Amount: 500
		ShowTicks: False
		RequiresCondition: bot-insurance-enabler && !noinsurance
	GrantConditionOnBotOwner@botinsurance:
		Condition: bot-insurance-enabler
		Bots: ai
	Capturable:
		RequiresCondition: !build-incomplete
		Types: building4
	SpawnActorOnDeath@Husk:
		Actor: CNST.Husk
        OwnerType: Victim
        EffectiveOwnerFromOwner: true
        RequiresCondition: !being-demolished
	SpawnActorsOnSell:
		ActorTypes: e1,e1,e1,tecn,tec2,engi
