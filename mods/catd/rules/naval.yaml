LST:
	Inherits: ^Ship
    Inherits@selection: ^SelectableSupportUnit
	HitShape:
		Type: Circle
			Radius: 576
	Valued:
		Cost: 700
	Tooltip:
		Name: Landing Craft
	TooltipExtras:
		Weaknesses: Unarmed
        Attributes: Carries one Vehicle\nor up to 5 Infantry
	Buildable:
        BuildDuration: 700
        BuildDurationModifier: 100
        BuildPaletteOrder: 10
		Queue: ShipSQ, ShipMQ
		Prerequisites: ~syrd, ~techlevel.minimum
		Description: Transports ground units across water.
	Mobile:
		Locomotor: landingcraft
		InitialFacing: 0
		TurnSpeed: 12
		Speed: 90
        PauseOnCondition: notmobile
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 3c512
	Selectable:
		Bounds: 2048, 2048
	WithCargo:
		DisplayTypes: Infantry, Vehicle
		LocalOffset: 390,-256,0, 390,256,0, 0,0,0, -390,-256,0, -390,256,0
	Cargo:
		Types: Infantry, Vehicle
		MaxWeight: 5
		PassengerFacing: 0
		UnloadVoice: Unload
		LoadingCondition: notmobile
        #   LoadedCondition: loaded
	WithCargoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		CustomPipSequences:
			gray: pip-gray
            green: pip-green
			yellow: pip-yellow
			red: pip-red
            blue: pip-blue

