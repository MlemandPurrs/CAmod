DriverKill:
    Inherits: Sniper
	Report: snipe.aud
    ValidTargets: Vehicle
    InvalidTargets: Infantry, Water, Structure, Wall, Husk, Creep
	Warhead@1Dam: SpreadDamage
		ValidTargets: Vehicle
        Versus:
            None: 25
            Wood: 75
            Light: 75
            Heavy: 100
            Concrete: 50
	Warhead@DriverKill: ChangeOwnerToNeutral
		ValidTargets: DriverKill
		InvalidTargets: Infantry, Ship, Structure, Wall, Husk, Air, AirSmall
		ValidRelationships: Enemy
		CargoEffect: Block
		Range: 0c511
	Warhead@highlight: GrantExternalConditionCA
		Range: 0c511
		Duration: 2
		Condition: highlight
		ValidTargets: DriverKill

