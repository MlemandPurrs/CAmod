MicroWave:
	ReloadDelay: 90
    Range: 5c768
	Report: corefir1.aud
	ValidTargets: GroundActor, WaterActor, Trees
	InvalidTargets: AirborneActor, Wall
	TargetActorCenter: true
	Projectile: Railgun
		Duration: 5
		Blockable: true
		DamageActorsInLine: false
		BeamColor: FFFFFFFF
		BeamWidth: 0c0
		HelixThickness: 0c32
		HelixRadius: 0c16
		HelixAngleDeltaPerTick: 64
		QuantizationCount: 64
		HitAnim: empfx
		ZOffset: 2046
	Warhead@1Dam: SpreadDamage
        ValidTargets: GroundActor, WaterActor, Trees
		InvalidTargets: AirborneActor, Wall
		Spread: 512
		Damage: 5000
		Versus:
			None: 100
			Wood: 100
			Light: 50
			Heavy: 50
			Concrete: 50
		DamageTypes: Prone50Percent, TriggerProne, Incendiary, FireDeath
		AffectsParent: false
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall
	Warhead@3Emp: GrantExternalCondition
		Range: 0c256
		Duration: 45
		Condition: emp-condition
		ValidTargets: EMPApplicable
        InvalidTargets: Invulnerable
	Warhead@DriverKill: ChangeOwnerToNeutral
		ValidTargets: DriverKill
		InvalidTargets: Infantry, Ship, Structure, Wall, Husk, Air, AirSmall
		ValidRelationships: Enemy
		CargoEffect: Kill
		Range: 0c511
	Warhead@highlight: GrantExternalConditionCA
		Range: 0c511
		Duration: 2
		Condition: highlight
		ValidTargets: DriverKill

