MCV:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Valued:
		Cost: 2500
	Tooltip:
		Name: Mobile Construction Vehicle
        GenericStancePrefix: false
        GenericName: MCV
        GenericVisibility: Ally, Neutral, Enemy
	TooltipExtras:
		Weaknesses: Unarmed
	EditorOnlyTooltip:
		Name: MCV
	Buildable:
    	BuildDuration: 2500
        BuildDurationModifier: 100
		BuildPaletteOrder: 80
		Queue: VehicleSQ, VehicleMQ
        Prerequisites: hq, ~techlevel.high
		Description: Deploys into another Construction Yard.
	Selectable:
		DecorationBounds: 1536, 1536
	Mobile:
		Speed: 60
        TurnSpeed: 12
		Locomotor: heavywheeled
	Health:
		HP: 60000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 8c0
	Transforms:
		IntoActor: cnst
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
		NoTransformTextNotification: Cannot deploy here.
		Voice: Unload
	MustBeDestroyed:
		RequiredForShortGame: true
	BaseBuilding:
	HitShape:
		Type: Circle
			Radius: 512
	SpawnActorOnDeath@Husk:
		Actor: MCV.Husk
        OwnerType: Victim
        EffectiveOwnerFromOwner: true
        RequiresCondition: !onref
	ExternalCondition@NOREFBLOCK:
		Condition: onref
        TotalCap: 1
	RenderSprites:
		Image: mcv
		FactionImages:
            nod: nmcv

MCV.Husk:
	Inherits: ^Husk
	Health: 
		HP: 37500
	Tooltip:
		Name: MCV (Destroyed)
	TransformOnCapture:
		IntoActor: mcv
	InfiltrateForTransform:
		IntoActor: mcv
	RenderSprites:
		Image: mcv.destroyed

HARV:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableEconomicUnit
	Valued:
		Cost: 1000
	Tooltip:
		Name: Tiberium Harvester
        GenericStancePrefix: false
        GenericName: Harvester
        GenericVisibility: Ally, Neutral, Enemy
	TooltipExtras:
        Strengths: Collects the Tiberium
		Weaknesses: Unarmed
        Attributes: Self-Repairs up until 50% Hp
	EditorOnlyTooltip:
		Name: Harvester
	Buildable:
    	BuildDuration: 1000
        BuildDurationModifier: 100
		BuildPaletteOrder: 10
		Prerequisites: refn, ~techlevel.low
		Queue: VehicleSQ, VehicleMQ
		Description: Collects Tiberium for processing.
	Selectable:
		DecorationBounds: 1536, 1536
	Harvester:
		Resources: Tiberium,BlueTiberium,RedTiberium
		Capacity: 20
		BaleLoadDelay: 12
		BaleUnloadDelay: 6
		SearchFromProcRadius: 15
		SearchFromHarvesterRadius: 8
		HarvestFacings: 8
		EmptyCondition: no-tiberium
	Mobile:
		Speed: 70
		Locomotor: heavywheeled
	Health:
		HP: 50000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 4c0
	ActorLostNotification:
		Notification: HarvesterLost
		TextNotification: Harvester lost.
	WithHarvestAnimation:
	WithDockingAnimation:
	Explodes@EMPTY:
		Weapon: UnitExplodeHarvEmpty
		EmptyWeapon: UnitExplodeHarvEmpty
	Explodes:
		RequiresCondition: !no-tiberium
		Weapon: UnitExplodeHarvFull
	WithHarvesterPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
		PipCount: 7
		ResourceSequences:
			Tiberium: pip-green
			BlueTiberium: pip-gray
			RedTiberium: pip-red
	ProximityExternalCondition@DOCKED:
		Condition: dockinprocess
		Range: 1c0
		ValidRelationships: Ally
	ExternalCondition@DOCKED:
		Condition: docked
		SourceCap: 1
		TotalCap: 1        
	RejectsOrders:
		RequiresCondition: docked
	HitShape:
		Type: Circle
			Radius: 512
	SpawnActorOnDeath@Husk:
		Actor: HARV.Husk
        OwnerType: Victim
        EffectiveOwnerFromOwner: true
        RequiresCondition: !onref
	ExternalCondition@NOREFBLOCK:
		Condition: onref
        TotalCap: 1
	ChangesHealth:
		Step: 100
		Delay: 25
		StartIfBelow: 50
		DamageCooldown: 500
        RequiresCondition: !emp-condition && !oncarryall
	Carryable:
		ReservedCondition: awaiting
		CarriedCondition: oncarryall
		LockedCondition: boarding
		LocalOffset: 0,0,200
	SpeedMultiplier@HARVBALANCE:
		RequiresCondition: harv-balance
		Modifier: 138
	HarvesterBalancer:
		Condition: harv-balance
	RenderSprites:
		Image: harv
		FactionImages:
            nod: nhrv

HARV.Husk:
	Inherits: ^Husk
