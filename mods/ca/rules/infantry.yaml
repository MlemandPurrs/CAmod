	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@experience: ^GainsExperience
    Inherits@expupgrade: ^AffectedBySpecialTraining
	Valued:
		Cost: 1000
	Tooltip:
		Name: Android Commando
	TooltipExtras:
        Strengths: Strong vs Infantry
		Weaknesses: Weak vs Anything else
        Attributes: Demolish structures with C4\nDetects invisible units
        RequiresCondition: !raufoss.on
	TooltipExtras@2:
        Strengths: Strong vs Infantry, Light Armor
		Weaknesses: Weak vs Anything else
        Attributes: Demolish structures with C4\nDetects invisible units\nCan driver kill Vehicles
        RequiresCondition: raufoss.on
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
    	BuildDuration: 1000
        BuildDurationModifier: 100
		BuildPaletteOrder: 50
		BuildLimit: 1
		Prerequisites: ~disabled
		Queue: InfantrySQ, AndroidMQ
		BuildAtProductionType: Android
		Description: Maximum 1 can be trained.\n\nElite cybernetic unit.
	Mobile:
		Speed: 75
        PauseOnCondition: emp-condition
	Health:
		HP: 25000
	Passenger:
		CustomPipType: red
	RevealsShroud:
		Range: 6c0
	DetectCloaked:
		Range: 6c0
    RenderDetectionCircle:
	AutoTarget:
		ScanRadius: 8
	Demolition:
		DetonationDelay: 45
		Voice: Attack
	Armament@1:
        Name: primary
		Weapon: Sniper
		ReloadingCondition: reload-primary
        PauseOnCondition: reload-secondary && emp-condition
    Armament@2:
        Name: secondary
        Weapon: DriverKill
		ReloadingCondition: reload-secondary
        PauseOnCondition: reload-primary && !ammo && emp-condition
        RequiresCondition: raufoss.on
	AmmoPool:
        Armaments: secondary
        InitialAmmo: 0
		Ammo: 1
		AmmoCondition: ammo
	ReloadAmmoPoolCA:
		Delay: 105
		Count: 1
        RequiresCondition: !ammo && raufoss.on
		SelectionBarColor: FFFF00
	WithAmmoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
        PipCount: 1
        FullSequence: pip-yellow
		RequiresSelection: false
        RequiresCondition: raufoss.on
	WithInfantryBody:
		DefaultAttackSequence: shoot
		IdleSequences: idle1,idle2,idle3
        RequiresCondition: !parachute
	WithInfantryBody@PARACHUTE:
		StandSequences: parachute
		RequiresCondition: parachute
		Palette: player-noshadow
		IsPlayerPalette: true
	ExternalCondition@PRODUCED:
		Condition: produced
	VoiceAnnouncement:
		RequiresCondition: produced
		Voice: Build
	Voiced:
		VoiceSet: AndroidVoice
	GrantConditionOnPrerequisite@raufoss:
		Condition: raufoss.on
		Prerequisites: raufoss.upgrade

CYP:
	Inherits: ^Cyborg
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@experience: ^GainsExperience
    Inherits@expupgrade: ^AffectedBySpecialTraining
    -Crushable:
    -GrantExternalConditionToCrusher@CRUSHSLOW:
	Valued:
		Cost: 1500
	Tooltip:
		Name: Cyborg Prototype
	TooltipExtras:
        Strengths: Strong vs Everything
		Weaknesses: Weak vs Nothing
        Attributes: Heals in Tiberium
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
    	BuildDuration: 1500
        BuildDurationModifier: 100
		BuildPaletteOrder: 210
		BuildLimit: 1
		Prerequisites: nuke, ~android.production
		Queue: InfantrySQ, AndroidMQ
		BuildAtProductionType: Android
		Description: Maximum 1 can be trained.\n\nCybernetic super-soldier,\narmed with green laser.
	Mobile:
        Locomotor: foot-chem
		Speed: 40
		PauseOnCondition: emp-condition
	Health:
		HP: 15000
	Passenger:
		CustomPipType: red
        Weight: 2
	RevealsShroud:
		Range: 6c0
	AutoTarget:
		ScanRadius: 8
	Armament:
		Weapon: TiberiumLaser
        LocalOffset: 256,43,241
        FireDelay: 3
		PauseOnCondition: emp-condition
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
		PauseOnCondition: emp-condition
	AttackMove:
		Voice: Attack
	WithInfantryBody:
		DefaultAttackSequence: shoot
        RequiresCondition: !parachute
	WithInfantryBody@PARACHUTE:
		StandSequences: parachute
		RequiresCondition: parachute
		Palette: player-noshadow
		IsPlayerPalette: true
	Voiced:
		VoiceSet: AndroidVoice
